<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiSakhi | Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<style>
.page { max-width:700px; margin:40px auto; padding:0 20px; }
h1 { font-size:1.8rem; color:#ff6b81; margin-bottom:6px; }
.sub { color:#888; font-size:14px; margin-bottom:28px; }
nav { display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap; }
nav a {
  padding:9px 18px; border-radius:10px; text-decoration:none;
  font-weight:600; font-size:14px; color:#888; background:white; box-shadow:var(--shadow);
}
nav a.active { background:linear-gradient(135deg,#ff6b81,#ffa94d); color:white; }

.podium { display:flex; align-items:flex-end; justify-content:center; gap:12px; margin-bottom:32px; }
.podium-item { text-align:center; }
.podium-avatar {
  width:56px; height:56px; border-radius:50%; object-fit:cover;
  background:linear-gradient(135deg,#ff6b81,#ffa94d);
  display:flex; align-items:center; justify-content:center;
  color:white; font-weight:800; font-size:1.2rem; margin:0 auto 6px;
}
.podium-block {
  border-radius:12px 12px 0 0; width:80px; display:flex;
  align-items:center; justify-content:center; font-size:1.5rem;
}
.podium-item:nth-child(1) .podium-block { height:80px; background:linear-gradient(135deg,#ffd700,#ffaa00); }
.podium-item:nth-child(2) .podium-block { height:100px; background:linear-gradient(135deg,#ff6b81,#ffa94d); }
.podium-item:nth-child(3) .podium-block { height:60px;  background:linear-gradient(135deg,#cd7f32,#a0522d); }
.podium-name { font-size:13px; font-weight:700; color:#333; margin-bottom:3px; }
.podium-pct  { font-size:12px; color:#888; }

.board-list { display:flex; flex-direction:column; gap:12px; }
.board-row {
  background:white; border-radius:14px; padding:18px 22px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:16px;
}
.board-row.me { border-left:4px solid #ff6b81; }
.rank { font-size:1.4rem; font-weight:800; color:#ff6b81; width:36px; text-align:center; }
.board-avatar {
  width:44px; height:44px; border-radius:50%; object-fit:cover;
  background:linear-gradient(135deg,#ff6b81,#ffa94d);
  display:flex; align-items:center; justify-content:center;
  color:white; font-weight:700; font-size:1rem; flex-shrink:0;
}
.board-avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
.board-info { flex:1; }
.board-name { font-weight:700; color:#2c3e50; font-size:15px; }
.board-badges { font-size:12px; color:#aaa; margin-top:2px; }
.board-right { text-align:right; }
.board-pct { font-size:1.3rem; font-weight:800; color:#ff6b81; }
.board-xp  { font-size:12px; color:#aaa; }
.board-bar { height:6px; background:#f0f0f0; border-radius:999px; margin-top:6px; overflow:hidden; }
.board-bar-fill { height:100%; background:linear-gradient(90deg,#ff6b81,#ffa94d); border-radius:999px; }
body.dark .board-row { background:var(--card); }
</style>
</head>
<body>
<script>if (!localStorage.getItem("token")) window.location.href = "login.html";</script>
<div class="page">
  <nav>
    <a href="ds.html">🏠 Home</a>
    <a href="profile.html">👤 Profile</a>
    <a href="certificate.html">🏆 Certs</a>
    <a href="leaderboard.html" class="active">🥇 Board</a>
  </nav>

  <h1>🥇 Leaderboard</h1>
  <p class="sub">Top learners on DigiSakhi — keep your streak going to climb the board!</p>

  <div class="podium" id="podium"></div>
  <div class="board-list" id="board-list"><p style="color:#aaa;text-align:center">Loading...</p></div>
</div>

<script src="shared.js"></script>
<script>
requireLogin();
const myId = getUserId();
const MEDALS = ["🥇","🥈","🥉"];

async function init() {
  const board = await apiFetch("/api/leaderboard");
  if (!board || !board.length) {
    document.getElementById("board-list").innerHTML = "<p style='color:#aaa;text-align:center'>No data yet. Start learning!</p>";
    return;
  }

  // Podium (top 3 reordered: 2nd, 1st, 3rd)
  const top3 = board.slice(0,3);
  const order = [top3[1], top3[0], top3[2]].filter(Boolean);
  document.getElementById("podium").innerHTML = order.map((u, i) => {
    const rank = order.indexOf(top3[0]) === i ? 1 : (i === 0 ? 2 : 3);
    return `
      <div class="podium-item">
        <div class="podium-avatar">${u.photo ? `<img src="http://localhost:5000${u.photo}">` : u.name[0].toUpperCase()}</div>
        <div class="podium-name">${u.name}</div>
        <div class="podium-pct">${u.totalProgress}%</div>
        <div class="podium-block">${MEDALS[rank-1]}</div>
      </div>`;
  }).join("");

  // Full list
  document.getElementById("board-list").innerHTML = board.map((u, i) => `
    <div class="board-row ${u.userId === myId ? 'me' : ''}">
      <div class="rank">${MEDALS[i] || (i+1)}</div>
      <div class="board-avatar">
        ${u.photo ? `<img src="http://localhost:5000${u.photo}">` : u.name[0].toUpperCase()}
      </div>
      <div class="board-info">
        <div class="board-name">${u.name} ${u.userId === myId ? '<span style="color:#ff6b81;font-size:12px">(You)</span>' : ''}</div>
        <div class="board-badges">${(u.badges||[]).slice(0,3).join(" ") || "No badges yet"}</div>
        <div class="board-bar"><div class="board-bar-fill" style="width:${u.totalProgress}%"></div></div>
      </div>
      <div class="board-right">
        <div class="board-pct">${u.totalProgress}%</div>
        <div class="board-xp">⭐ ${u.xp} XP</div>
      </div>
    </div>
  `).join("");
}

init();
</script>
</body>
</html>
