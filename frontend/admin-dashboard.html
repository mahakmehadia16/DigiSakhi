<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiSakhi | Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<style>
.page { max-width:1000px; margin:30px auto; padding:0 20px 60px; }
header { background:linear-gradient(135deg,#ff6b81,#ffa94d); color:white; padding:20px 40px; display:flex; justify-content:space-between; align-items:center; }
header h1 { font-size:1.6rem; }
header a { color:white; text-decoration:none; font-weight:700; background:rgba(255,255,255,0.2); padding:8px 16px; border-radius:8px; }
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin:28px 0; }
.stat-card { background:white; border-radius:14px; padding:22px; box-shadow:var(--shadow); text-align:center; }
.stat-card .val { font-size:2.2rem; font-weight:800; color:#ff6b81; }
.stat-card .lbl { font-size:13px; color:#888; margin-top:4px; }
.charts-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px; }
.chart-card { background:white; border-radius:14px; padding:24px; box-shadow:var(--shadow); }
.chart-card h3 { font-size:1rem; color:#2c3e50; margin-bottom:16px; }
.users-table { background:white; border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.users-table h3 { padding:20px 24px 0; font-size:1rem; color:#2c3e50; }
table { width:100%; border-collapse:collapse; }
th { background:#f9f9f9; padding:12px 18px; text-align:left; font-size:13px; color:#888; font-weight:700; }
td { padding:14px 18px; border-top:1px solid #f5f5f5; font-size:14px; }
.status-badge {
  display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;
}
.status-active  { background:#d4edda; color:#155724; }
.status-blocked { background:#f8d7da; color:#721c24; }
.action-btn {
  padding:5px 12px; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-weight:700; margin-right:4px;
}
.btn-block  { background:#fff3cd; color:#856404; }
.btn-unblock { background:#d4edda; color:#155724; }
.btn-delete { background:#f8d7da; color:#721c24; }
.notify-section { background:white; border-radius:14px; padding:24px; box-shadow:var(--shadow); margin-bottom:28px; }
.notify-section h3 { color:#2c3e50; margin-bottom:14px; }
.notify-row { display:flex; gap:10px; }
.notify-input {
  flex:1; padding:11px 14px; border:1.5px solid #eee; border-radius:10px; font-size:14px; outline:none;
}
.notify-input:focus { border-color:#ff6b81; }
.btn-notify { background:linear-gradient(135deg,#ff6b81,#ffa94d); color:white; border:none; padding:11px 22px; border-radius:10px; font-weight:700; cursor:pointer; }
@media(max-width:700px){ .stats-grid{grid-template-columns:repeat(2,1fr);} .charts-row{grid-template-columns:1fr;} }
body.dark .stat-card, body.dark .chart-card, body.dark .users-table, body.dark .notify-section { background:var(--card); }
</style>
</head>
<body>
<script>if (!localStorage.getItem("token")) window.location.href = "login.html";</script>

<header>
  <h1>🛡️ Admin Dashboard</h1>
  <a href="ds.html">← Back to App</a>
</header>

<div class="page">
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="val" id="s-users">-</div><div class="lbl">👥 Total Users</div></div>
    <div class="stat-card"><div class="val" id="s-certs">-</div><div class="lbl">🏆 Certificates</div></div>
    <div class="stat-card"><div class="val" id="s-blocked">-</div><div class="lbl">🚫 Blocked</div></div>
    <div class="stat-card"><div class="val" id="s-modules">-</div><div class="lbl">📚 Active Modules</div></div>
  </div>

  <!-- Charts -->
  <div class="charts-row">
    <div class="chart-card">
      <h3>📈 Module Progress (Avg %)</h3>
      <canvas id="moduleChart" height="220"></canvas>
    </div>
    <div class="chart-card">
      <h3>📅 New Users (Last 7 Days)</h3>
      <canvas id="signupChart" height="220"></canvas>
    </div>
  </div>

  <!-- Push notification sender -->
  <div class="notify-section">
    <h3>📢 Send Live Notification to All Users</h3>
    <div class="notify-row">
      <input class="notify-input" id="notify-msg" placeholder="Type your announcement...">
      <button class="btn-notify" onclick="sendNotification()">Send 🚀</button>
    </div>
  </div>

  <!-- Users table -->
  <div class="users-table">
    <h3 style="margin-bottom:12px">👥 All Users</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Email</th><th>Joined</th><th>Status</th><th>Role</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody"><tr><td colspan="6" style="color:#aaa;text-align:center;padding:30px">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<script src="shared.js"></script>
<script>
requireLogin();

async function init() {
  // Check admin role
  const user = getUser();
  if (user.role !== "admin") {
    alert("Admin access only!");
    window.location.href = "ds.html";
    return;
  }

  const stats = await apiFetch("/api/admin/stats");
  if (!stats) return;

  document.getElementById("s-users").textContent   = stats.totalUsers;
  document.getElementById("s-certs").textContent   = stats.totalCerts;
  document.getElementById("s-blocked").textContent = stats.blockedUsers;
  document.getElementById("s-modules").textContent = stats.moduleStats?.length || 0;

  // Module chart
  if (stats.moduleStats?.length) {
    new Chart(document.getElementById("moduleChart"), {
      type: "bar",
      data: {
        labels: stats.moduleStats.map(m => m._id),
        datasets: [{
          label: "Avg Progress %",
          data:  stats.moduleStats.map(m => Math.round(m.avgProgress)),
          backgroundColor: stats.moduleStats.map((_, i) =>
            ["#ff6b81","#ffa94d","#74c0fc","#b197fc","#63e6be","#ffd43b","#ff8787","#a9e34b"][i % 8]
          ),
          borderRadius: 8
        }]
      },
      options: {
        responsive: true, plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, max: 100 } }
      }
    });
  }

  // Signup chart
  if (stats.dailySignups?.length) {
    new Chart(document.getElementById("signupChart"), {
      type: "line",
      data: {
        labels: stats.dailySignups.map(d => d._id),
        datasets: [{
          label: "New users",
          data:  stats.dailySignups.map(d => d.count),
          borderColor: "#ff6b81", backgroundColor: "rgba(255,107,129,0.1)",
          fill: true, tension: 0.4, pointRadius: 5
        }]
      },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });
  }

  await loadUsers();
}

async function loadUsers() {
  const users = await apiFetch("/api/admin/users");
  if (!users) return;

  const tbody = document.getElementById("users-tbody");
  tbody.innerHTML = users.map(u => `
    <tr>
      <td><strong>${u.name}</strong><br><span style="color:#aaa;font-size:12px">@${u.username}</span></td>
      <td>${u.email}</td>
      <td>${new Date(u.createdAt).toLocaleDateString("en-IN")}</td>
      <td><span class="status-badge ${u.isBlocked ? 'status-blocked' : 'status-active'}">${u.isBlocked ? '🚫 Blocked' : '✅ Active'}</span></td>
      <td>${u.role === "admin" ? "👑 Admin" : "User"}</td>
      <td>
        <button class="action-btn ${u.isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${u._id}', ${u.isBlocked})">
          ${u.isBlocked ? "Unblock" : "Block"}
        </button>
        <button class="action-btn btn-delete" onclick="deleteUser('${u._id}', '${u.name}')">Delete</button>
      </td>
    </tr>
  `).join("");
}

async function toggleBlock(id, isBlocked) {
  const data = await apiFetch(`/api/admin/block/${id}`, { method: "PUT" });
  if (data) { toast(data.message); await loadUsers(); }
}

async function deleteUser(id, name) {
  if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
  const data = await apiFetch(`/api/admin/user/${id}`, { method: "DELETE" });
  if (data) { toast("User deleted"); await loadUsers(); }
}

async function sendNotification() {
  const msg = document.getElementById("notify-msg").value.trim();
  if (!msg) return;
  // Use socket to broadcast
  const socket = io("http://localhost:5000");
  socket.on("connect", () => {
    socket.emit("admin-broadcast", { message: msg, type: "info" });
    socket.disconnect();
  });
  // Also emit via REST for persistence (just show it locally as success)
  toast("📢 Notification sent to all users!");
  document.getElementById("notify-msg").value = "";
}

init();
</script>
</body>
</html>
